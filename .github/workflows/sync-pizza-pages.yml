name: Sync pizza data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pizza-sync.txt

      - name: Install sync dependencies
        run: python -m pip install --requirement requirements-pizza-sync.txt

      - name: Pull current pizza data and images from Google Drive
        run: python scripts/sync_pizza_content.py

      - name: Rebuild pizza charts
        run: python scripts/build_pizza_charts.py

      - name: Prepare static site
        run: |
          mkdir -p _site/scripts
          cp index.html icon_beer.png icon_pizza.png _site/
          cp -R data html images styles _site/
          cp scripts/main.js _site/scripts/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
